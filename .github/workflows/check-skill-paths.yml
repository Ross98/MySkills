name: Check skill paths

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portable-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject machine-specific home paths
        run: |
          if git grep -n -E '/Users/[^/[:space:]]+/' -- preserving-layout-document-translation/; then
            echo "Remove machine-specific /Users paths from the skill." >&2
            exit 1
          fi
